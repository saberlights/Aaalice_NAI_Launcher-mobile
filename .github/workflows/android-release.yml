name: Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare mobile databases
        run: python3 tool/database/prepare_mobile_databases.py

      - name: Verify database assets
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          expected = {
              Path('assets/databases/translation.db'): {'tags', 'translations'},
              Path('assets/databases/cooccurrence.db'): {'cooccurrences'},
          }
          for path, tables in expected.items():
              with path.open('rb') as handle:
                  assert handle.read(16) == b'SQLite format 3\x00', path
              connection = sqlite3.connect(path)
              try:
                  actual = {
                      row[0]
                      for row in connection.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                  }
                  assert tables <= actual, (path, tables - actual)
                  assert connection.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              finally:
                  connection.close()
          PY

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify version comparison
        run: dart run tool/testing/version_comparator_check.dart

      - name: Build release APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-apk.log

      - name: Report APK build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          error_message="$( (grep -E 'FAILURE:|Error:|ERROR:|What went wrong|Exception' build-apk.log || true) | tail -n 20 | tr '\n' ' ' )"
          if [ -z "$error_message" ]; then
            error_message='flutter build apk failed; inspect the build log'
          fi
          error_message="${error_message//'%'/'%25'}"
          error_message="${error_message//$'\n'/'%0A'}"
          error_message="${error_message//$'\r'/'%0D'}"
          echo "::error file=.github/workflows/android-release.yml,line=50::$error_message"
          exit 1

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aaalice-NAI-Launcher-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
